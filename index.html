<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카운터</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-family: system-ui, sans-serif;
      background: #f5f5f7;
    }
    #count {
      font-size: 96px;
      font-weight: 700;
      color: #222;
    }
    button {
      font-size: 24px;
      padding: 12px 32px;
      border: none;
      border-radius: 12px;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div id="count">0</div>
  <button id="btn">+2</button>

  <script>
    let count = 0;
    const display = document.getElementById('count');
    document.getElementById('btn').addEventListener('click', () => {
      count += 2;
      display.textContent = count;
    });
  </script>
</body>
</html>
