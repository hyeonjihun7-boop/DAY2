<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화면 부품 지도</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #eaf6fb; color: #0c3a52; }
    .note { margin: 0; padding: 10px 16px; font-size: 13px; background: #fef3c7; color: #78350f; text-align: center; }

    /* 이름표 */
    .part { position: relative; outline: 2px dashed #f59e0b; outline-offset: -2px; }
    .tag {
      position: absolute; top: 6px; right: 6px; z-index: 5;
      padding: 3px 10px; border-radius: 999px;
      background: #f59e0b; color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap;
      pointer-events: none;
    }

    /* index.html 과 같은 모양 */
    header { padding: 32px 16px 24px; text-align: center; color: #fff; background: linear-gradient(135deg, #0ea5e9, #0369a1); }
    header h1 { margin: 0 0 4px; font-size: 28px; }
    header p { margin: 0; opacity: .9; font-size: 14px; }
    nav { background: #0c4a6e; }
    nav ul { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; flex-wrap: wrap; }
    nav a { display: block; padding: 14px 20px; color: #bae6fd; text-decoration: none; font-size: 15px; border-bottom: 3px solid transparent; }
    nav a.active { color: #fff; border-bottom-color: #38bdf8; background: #075985; }
    main { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 32px 16px; }
    .card { width: 100%; max-width: 340px; padding: 40px 24px 32px; text-align: center; background: #fff; border-radius: 20px; box-shadow: 0 8px 24px rgba(3,105,161,.15); }
    .card h2 { margin: 0 0 8px; font-size: 18px; }
    #count { font-size: 96px; font-weight: 700; color: #0c4a6e; line-height: 1.2; }
    .field { margin: 0 0 16px; }
    input { display: block; width: 100%; padding: 10px 14px; font-size: 16px; border: 2px solid #bae6fd; border-radius: 10px; }
    .btnbox { display: inline-block; }
    button { font-size: 24px; padding: 12px 32px; border: none; border-radius: 12px; background: #0284c7; color: #fff; cursor: pointer; }
    .list { width: 100%; max-width: 340px; padding: 36px 24px 16px; background: #fff; border-radius: 20px; }
    .list ul { margin: 0; padding-left: 20px; line-height: 1.8; font-size: 15px; }
    footer { padding: 20px 16px; text-align: center; font-size: 13px; color: #bae6fd; background: #0c4a6e; }
  </style>
</head>
<body>
  <p class="note">index.html 화면의 부품에 이름표를 붙인 지도예요. (같은 모양을 옮겨 온 복사본이라 목록은 일부만 보여요)</p>

  <header class="part">
    <span class="tag">헤더</span>
    <h1>🌊 내 취향 카드</h1>
    <p>푸른 바다를 닮은 나만의 카드</p>
  </header>

  <nav class="part">
    <span class="tag">탭 (바다 메뉴)</span>
    <ul>
      <li><a href="#" class="active">🏖️ 바다</a></li>
      <li><a href="#">🐚 조개</a></li>
      <li><a href="#">🐬 돌고래</a></li>
      <li><a href="#">⛵ 항해</a></li>
    </ul>
  </nav>

  <main>
    <section class="card part">
      <span class="tag">카드</span>
      <h2>🌴 파도 카운터</h2>
      <div id="count">0</div>
      <div class="field part"><span class="tag">입력창 (예시 · 원본엔 없음)</span><input type="text" placeholder="내 취향을 적어 보세요 🌊"></div>
      <div class="btnbox part"><span class="tag">버튼</span><button id="btn">+2</button></div>
    </section>

    <section class="list part">
      <span class="tag">목록</span>
      <ul>
        <li>🌊 푸른 바다와 한라산 사이…</li>
        <li>🏛️ 제주도를 대표하는 국립 종합대학교예요.</li>
        <li>🌸 봄에는 벚꽃이 캠퍼스를 물들입니다.</li>
        <li>…</li>
      </ul>
    </section>
  </main>

  <footer>© 2026 내 취향 카드 · 🌊 바다가 좋아요</footer>

  <script>
    let count = 0;
    const display = document.getElementById('count');
    document.getElementById('btn').addEventListener('click', () => {
      count += 2;
      display.textContent = count;
    });
  </script>
</body>
</html>
